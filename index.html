<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1f3a2b">
<title>Field Voice Log</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Field Voice Log v0.1 — HF terrestrial biodiversity field capture
   Map full screen; big three-state button (grey = no site, green = site active, red = recording) */
:root{--green:#2e7d4f;--deep:#1f3a2b;--red:#d23c3c;--grey:#7d8580;--ochre:#d99a1e;--ink:#1b1f1c;--bg:#fff;--line:#d9ddd9;--soft:#f2f4f2}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden}
#map{position:fixed;inset:0;z-index:0}
.leaflet-top{top:62px}
#top{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--deep);color:#fff}
#proj{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#555;white-space:nowrap}
.chip.good{background:#2e7d4f}.chip.ok{background:#b07a12}.chip.bad{background:#b03030}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;min-height:44px;padding:0 14px;background:var(--soft);color:var(--ink);font-weight:600}
button:focus-visible{outline:3px solid #6aa9ff;outline-offset:2px}
button:disabled{opacity:.4}
#menuBtn{background:#ffffff22;color:#fff}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:500;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:grid;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#live{background:#000000c0;color:#fff;border-radius:12px;padding:8px 12px;font-size:15px;display:none;max-height:30vh;overflow:auto}
#live.show{display:block}
#live b{color:#ffd36b}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:grid;gap:6px}
.side button{background:#fffffff0;box-shadow:0 2px 8px #0004;font-size:14px}
#trackBtn.on{background:var(--ochre);color:#fff}
#big{width:112px;height:112px;border-radius:50%;color:#fff;font-size:17px;line-height:1.1;box-shadow:0 4px 16px #0006;border:5px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
#big small{font-size:12px;font-weight:500;opacity:.9;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#big.idle{background:var(--grey)}#big.active{background:var(--green)}#big.rec{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #d23c3c44}}
@media(prefers-reduced-motion:reduce){#big.rec{animation:none}}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px #0005;max-height:82vh;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s}
#sheet.open{transform:none}
#sheet h2{margin:0 0 4px;font-size:21px}
#sheet h3{margin:18px 0 6px;font-size:16px}
.meta{font-size:13px;color:#59615c}
.close{float:right;margin-left:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{background:var(--soft);font-size:13px;white-space:nowrap}
td[contenteditable]{min-width:90px;background:#fffdf3}
td.sp{font-style:italic;color:#59615c}
td.x button{min-height:32px;padding:0 10px;background:#fbe9e9;color:#a02020}
textarea,input[type=text]{width:100%;font:16px/1.4 inherit;padding:10px;border:1px solid var(--line);border-radius:10px}
textarea{min-height:90px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.primary{background:var(--green);color:#fff}.danger{background:#fbe9e9;color:#a02020}
.note{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}
.pin{background:var(--deep);color:#fff;border:2px solid #fff;border-radius:14px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px #0007;transform:translate(-50%,-50%);display:inline-block}
.pin.on{background:var(--green)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:1000;background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;display:none;max-width:90vw}
#warn{display:none;background:#b03030;color:#fff;padding:8px 12px;font-size:14px;position:fixed;top:56px;left:0;right:0;z-index:600}
.help li{margin-bottom:6px}
.plist button{width:100%;text-align:left;margin-bottom:6px}
.plist button.cur{background:#dcefe3}
</style>
</head>
<body>
<div id="map"></div>
<div id="top"><div id="proj">Project</div><div id="gps" class="chip">GPS …</div><button id="menuBtn" aria-label="Menu">Menu</button></div>
<div id="warn"></div>
<div id="toast"></div>
<div id="bottom">
  <div id="live"></div>
  <div class="row">
    <div class="side"><button id="trackBtn">Track off</button><button id="typeBtn">Type</button></div>
    <button id="big" class="idle">Start site<small>tap &amp; speak</small></button>
    <div class="side"><button id="finBtn" disabled>Finalise site</button><button id="centreBtn">Centre</button></div>
  </div>
</div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<script>
{
/* ---------- storage ---------- */
const KEY='fvl_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.projects)return d}catch(e){}return{projects:[],active:null}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save – storage full or blocked. Export a backup now.')}}
function newProject(name){const p={id:uid(),name:name||('Project '+new Date().toISOString().slice(0,10)),created:new Date().toISOString(),sites:[],records:[],notes:[],tracks:[],checklist:[],activeSite:null,activeTrack:null};db.projects.push(p);db.active=p.id;save();return p}
const P=()=>db.projects.find(p=>p.id===db.active);
if(!P())newProject();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const site=()=>{const p=P();return p.sites.find(s=>s.id===p.activeSite)||null};
const track=()=>{const p=P();return p.tracks.find(t=>t.id===p.activeTrack)||null};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>{s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1)};
const now=()=>new Date().toISOString();
const pt=at=>({lat:at?at.lat:null,lng:at?at.lng:null,acc:at?at.acc:null,time:now()});
const fmtT=iso=>iso?new Date(iso).toLocaleString('en-ZA',{dateStyle:'short',timeStyle:'short'}):'';
const fmtC=(la,ln)=>la==null?'no fix':`${la.toFixed(6)}, ${ln.toFixed(6)}`;
function dist(a,b){const R=6371000,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLn=(b[1]-a[1])*r;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const trackLen=t=>t.pts.reduce((s,p,i)=>i?s+dist(t.pts[i-1],p):0,0);
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
if(!window.isSecureContext){$('warn').style.display='block';$('warn').textContent='This page must be opened over https:// for GPS and microphone to work.'}

/* ---------- species matching ---------- */
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function match(spoken,list){if(!list||!list.length)return null;const q=norm(spoken);let best=null,bs=0;
  for(const c of list){for(const f of [c.common,c.scientific]){for(const v of String(f||'').split(/[;\/,]/)){const n=norm(v);if(!n)continue;const sc=sim(q,n);if(sc>bs){bs=sc;best=c}}}}
  return bs>=0.78?best:null}
function applyMatch(r){const m=match(r.spoken,P().checklist);if(m){r.family=m.family;r.scientific=m.scientific;r.common=m.common;r.status=m.status;r.matched=true}else r.matched=false;return r}

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false}).setView([-25.75,28.19],12);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap © OpenStreetMap'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
sat.addTo(map);L.control.layers({Satellite:sat,Topographic:topo,Street:osm},null,{position:'topright'}).addTo(map);
const layer=L.layerGroup().addTo(map);
let me=null,meAcc=null,centred=false;
function render(){
  const p=P();layer.clearLayers();$('proj').textContent=p.name;
  p.tracks.forEach(t=>{if(t.pts.length>1)L.polyline(t.pts.map(x=>[x[0],x[1]]),{color:t.id===p.activeTrack?'#ffb000':'#ff7a00',weight:5,opacity:.9}).on('click',()=>showTrack(t.id)).addTo(layer)});
  p.records.forEach(r=>{if(r.lat!=null)L.circleMarker([r.lat,r.lng],{radius:4,color:'#fff',weight:1,fillColor:'#ffd36b',fillOpacity:1}).on('click',()=>showSite(r.siteId)).addTo(layer)});
  p.sites.forEach(s=>{if(s.lat==null)return;L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<span class="pin ${s.id===p.activeSite?'on':''}">${esc(s.name)}</span>`,iconSize:[0,0]})}).on('click',()=>showSite(s.id)).addTo(layer)});
  setBtn();
}

/* ---------- GPS ---------- */
let fix=null;
function onFix(pos){fix={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
  const g=$('gps');g.textContent='± '+fix.acc+' m';g.className='chip '+(fix.acc<=10?'good':fix.acc<=30?'ok':'bad');
  const ll=[fix.lat,fix.lng];
  if(!me){me=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1e88ff',fillOpacity:1}).addTo(map);meAcc=L.circle(ll,{radius:fix.acc,color:'#1e88ff',weight:1,fillOpacity:.1}).addTo(map)}
  else{me.setLatLng(ll);meAcc.setLatLng(ll).setRadius(fix.acc)}
  if(!centred){map.setView(ll,17);centred=true}
  const s=site();if(s&&s.lat==null){Object.assign(s,{lat:fix.lat,lng:fix.lng,acc:fix.acc});save();render()}
  trackPoint();
}
if('geolocation' in navigator)navigator.geolocation.watchPosition(onFix,e=>{$('gps').textContent='GPS: '+(e.code===1?'denied':'no fix');$('gps').className='chip bad'},{enableHighAccuracy:true,maximumAge:2000,timeout:30000});
else $('gps').textContent='No GPS';
$('centreBtn').onclick=()=>{if(fix)map.setView([fix.lat,fix.lng],Math.max(map.getZoom(),17));else toast('No GPS fix yet')};

/* ---------- screen wake ---------- */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(site()||track()))wake()});

/* ---------- sites ---------- */
function createSite(at,name){const p=P();const n=p.sites.length+1;
  const s={id:uid(),name:name||('Site '+String(n).padStart(2,'0')),lat:at?at.lat:null,lng:at?at.lng:null,acc:at?at.acc:null,start:now(),end:null,habitat:[]};
  p.sites.push(s);p.activeSite=s.id;save();return s}
function finalise(){const p=P(),s=site();if(!s)return;s.end=now();p.activeSite=null;save();render();toast(s.name+' finalised')}
const hasContent=s=>{const p=P();return s.habitat.length||p.records.some(r=>r.siteId===s.id)||p.notes.some(n=>n.siteId===s.id)};
function siteName(body){body=body.replace(/^(name|number|no|nr)\s+/i,'').trim();return /^\d+$/.test(body)?'Site '+body.padStart(2,'0'):cap(body)}

/* ---------- parsing ---------- */
/* Keywords: "site" (first word only), "species", "habitat", "note".
   Habitat and note absorb the rest of the recording, so "alien species" inside a habitat description stays in the habitat. */
const KW=[['species',/^(species|specie)$/],['habitat',/^(habitat|habitats)$/],['note',/^(note|notes|observation|observations)$/]];
function parse(text){
  const words=text.replace(/[,.;:!?]/g,' ').replace(/\b(um+|uh+|er+)\b/gi,' ').split(/\s+/).filter(Boolean);
  const segs=[];let cur={type:'note',words:[],implicit:true};
  words.forEach((w,i)=>{const lw=w.toLowerCase();let k=null;
    if(i===0&&lw==='site')k='site';
    else if(cur.implicit||cur.type==='site'||cur.type==='species'){for(const [t,re] of KW)if(re.test(lw))k=t}
    if(k){if(cur.words.length)segs.push(cur);cur={type:k,words:[]}}else cur.words.push(w)});
  if(cur.words.length)segs.push(cur);return segs}
function processText(text,at){
  text=(text||'').trim();if(!text){toast('Nothing heard – try again');return}
  const p=P();let s=site();const segs=parse(text);let nSp=0,nH=0,nN=0;
  if(segs[0]&&segs[0].type==='site'){const nm=siteName(segs[0].words.join(' '));
    if(s&&hasContent(s)){finalise();s=createSite(at,nm)}else if(s)s.name=nm;else s=createSite(at,nm);segs.shift()}
  if(!s)s=createSite(at);
  for(const g of segs){const body=g.words.join(' ').trim();if(!body)continue;
    if(g.type==='species'){body.split(/\b(?:next|and)\b/i).map(x=>x.trim()).filter(Boolean).forEach(n=>{p.records.push(applyMatch({id:uid(),siteId:s.id,spoken:cap(n),family:'',scientific:'',common:'',status:'',...pt(at)}));nSp++})}
    else if(g.type==='habitat'){s.habitat.push({text:cap(body),...pt(at)});nH++}
    else{p.notes.push({id:uid(),siteId:s.id,text:cap(body),...pt(at)});nN++}}
  save();render();
  toast(`${s.name}: ${[nSp&&nSp+' species',nH&&'habitat added',nN&&nN+' note'].filter(Boolean).join(', ')||'site named'}`);
}

/* ---------- speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recording=false,busy=false,finals=[],interim='',recFix=null;
function addFinal(t){t=t.trim();if(!t)return;const last=finals[finals.length-1],lt=t.toLowerCase();
  if(last&&lt.startsWith(last.toLowerCase()))finals[finals.length-1]=t;else if(last&&last.toLowerCase().startsWith(lt))return;else finals.push(t)}
function showLive(){const l=$('live');if(recording){l.classList.add('show');l.innerHTML='<b>Listening…</b> '+esc(finals.join(' '))+' <i>'+esc(interim)+'</i>'}else l.classList.remove('show')}
function startRec(){
  if(!SR){toast('Voice not supported in this browser – use Chrome, or tap Type');return}
  finals=[];interim='';recFix=fix;recording=true;
  rec=new SR();rec.lang='en-ZA';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)addFinal(r[0].transcript);else interim+=' '+r[0].transcript}showLive()};
  rec.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;
    if(e.error==='network')toast('No signal – voice needs data. Tap Type instead.');
    else if(e.error==='not-allowed')toast('Microphone permission denied');else toast('Voice error: '+e.error)};
  rec.onend=()=>{if(recording){try{rec.start()}catch(x){}}};
  try{rec.start()}catch(x){}
  showLive();setBtn();wake();
}
function stopRec(){recording=false;busy=true;setBtn();try{rec.stop()}catch(x){}
  setTimeout(()=>{const text=(finals.join(' ')+' '+interim).trim();interim='';busy=false;showLive();processText(text,recFix||fix)},800)}
function setBtn(){const b=$('big'),s=site();
  if(recording){b.className='rec';b.innerHTML='Stop<small>'+esc(s?s.name:'')+'</small>'}
  else if(busy){b.className='rec';b.innerHTML='…<small>processing</small>'}
  else if(s){b.className='active';b.innerHTML='Record<small>'+esc(s.name)+'</small>'}
  else{b.className='idle';b.innerHTML='Start site<small>tap &amp; speak</small>'}
  $('finBtn').disabled=!s||recording||busy;
  const t=$('trackBtn');t.classList.toggle('on',!!track());t.textContent=track()?'Track on':'Track off'}
$('big').onclick=()=>{if(busy)return;if(recording){stopRec();return}
  if(!site()){if(!fix)toast('No GPS fix yet – site will take the first fix');createSite(fix);render()}
  startRec()};
$('finBtn').onclick=finalise;

/* ---------- tracks ---------- */
$('trackBtn').onclick=()=>{const p=P(),t=track();
  if(!t){const n={id:uid(),name:'Track '+String(p.tracks.length+1).padStart(2,'0'),start:now(),end:null,pts:[]};p.tracks.push(n);p.activeTrack=n.id;wake();toast('Track recording – keep the screen on')}
  else{t.end=now();p.activeTrack=null;toast(t.name+' saved ('+(trackLen(t)/1000).toFixed(2)+' km)')}
  save();render()};
let lastDraw=0;
function trackPoint(){const t=track();if(!t||!fix||fix.acc>50)return;const ll=[+fix.lat.toFixed(6),+fix.lng.toFixed(6)];const last=t.pts[t.pts.length-1];
  if(!last||dist(last,ll)>=5){t.pts.push([ll[0],ll[1],Date.now()]);save();if(Date.now()-lastDraw>3000){lastDraw=Date.now();render()}}}

/* ---------- sheet views ---------- */
const sheet=$('sheet');
function open(html){sheet.innerHTML='<button class="close" data-a="close">Close</button>'+html;sheet.classList.add('open');sheet.scrollTop=0}
function closeSheet(){sheet.classList.remove('open')}
let curSite=null;
function showSite(id){const p=P(),s=p.sites.find(x=>x.id===id);if(!s)return;curSite=id;
  const recs=p.records.filter(r=>r.siteId===id),notes=p.notes.filter(n=>n.siteId===id);
  open(`<h2>${esc(s.name)}</h2>
  <div class="meta">${fmtC(s.lat,s.lng)}${s.acc!=null?' (± '+s.acc+' m)':''} · ${fmtT(s.start)}${s.end?' – '+fmtT(s.end):' · <b>active</b>'}</div>
  <h3>Species (${recs.length})</h3>
  <div class="scroll"><table><thead><tr><th>Family</th><th>Scientific name</th><th>Common name</th><th>Status</th><th>As spoken</th><th></th></tr></thead><tbody>
  ${recs.map(r=>`<tr>${['family','scientific','common','status'].map(f=>`<td contenteditable data-id="${r.id}" data-f="${f}"${f==='scientific'?' style="font-style:italic"':''}>${esc(r[f])}</td>`).join('')}<td class="sp">${esc(r.spoken)}${r.matched?'':' ⚑'}</td><td class="x"><button data-a="delrec" data-id="${r.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6">No species yet</td></tr>'}
  </tbody></table></div>
  <div class="meta">Tap a cell to edit. ⚑ = not matched to the checklist.</div>
  <div class="btns"><input type="text" id="addSp" placeholder="Add species (separate with 'next' or 'and')"><button class="primary" data-a="addsp">Add species</button></div>
  <h3>Habitat</h3><textarea id="hab">${esc(s.habitat.map(h=>h.text).join('\n'))}</textarea>
  <h3>Notes (${notes.length})</h3>${notes.map(n=>`<div class="note"><span>${esc(n.text)} <span class="meta">${fmtT(n.time)}</span></span><button class="danger" data-a="delnote" data-id="${n.id}">✕</button></div>`).join('')||'<div class="meta">No notes</div>'}
  <h3>Site</h3><input type="text" id="sname" value="${esc(s.name)}">
  <div class="btns"><button class="primary" data-a="savesite">Save</button>
  ${s.id===p.activeSite?'':'<button data-a="reopen">Reopen site</button>'}
  ${fix?'<button data-a="moveSite">Move pin to my position</button>':''}
  <button class="danger" data-a="delsite">Delete site</button></div>`)}
function showTrack(id){const p=P(),t=p.tracks.find(x=>x.id===id);if(!t)return;
  const t0=new Date(t.start),t1=t.end?new Date(t.end):new Date();
  const ss=p.sites.filter(s=>new Date(s.start)>=t0&&new Date(s.start)<=t1);
  open(`<h2>${esc(t.name)}</h2><div class="meta">${fmtT(t.start)} – ${t.end?fmtT(t.end):'recording'} · ${(trackLen(t)/1000).toFixed(2)} km · ${t.pts.length} points</div>
  <h3>Sites recorded during this track</h3>${ss.map(s=>`<div class="note"><span>${esc(s.name)} – ${p.records.filter(r=>r.siteId===s.id).length} species</span><button data-a="gosite" data-id="${s.id}">Open</button></div>`).join('')||'<div class="meta">None</div>'}
  <div class="btns"><button class="danger" data-a="deltrack" data-id="${t.id}">Delete track</button></div>`)}
function showType(){open(`<h2>Type an entry</h2><div class="meta">Same keywords as voice, e.g. "species red grass and sickle bush" or "habitat open grassland on shallow soils".</div>
  <textarea id="typed" placeholder="species … / habitat … / note … / site …"></textarea><div class="btns"><button class="primary" data-a="typed">Add at my position</button></div>`)}
function showMenu(){const p=P();
  open(`<h2>Project</h2><input type="text" id="pname" value="${esc(p.name)}"><div class="btns"><button class="primary" data-a="savep">Rename</button><button data-a="newp">New project</button></div>
  <div class="meta">${p.sites.length} sites · ${p.records.length} species records · ${p.tracks.length} tracks</div>
  <h3>Export</h3><div class="btns"><button class="primary" data-a="xlsx">Excel (.xlsx)</button><button data-a="share">Share Excel…</button><button data-a="csv">CSV</button><button data-a="kml">KML (Google Earth)</button><button data-a="geojson">GeoJSON (QGIS)</button><button data-a="backup">Backup (.json)</button></div>
  <h3>Species checklist</h3><div class="meta">${p.checklist.length?p.checklist.length+' taxa loaded':'None loaded'}. Load a CSV or Excel file with columns Family, Scientific name, Common name, Status. Spoken names are matched to it.</div>
  <div class="btns"><label class="btnlike"><input type="file" id="clFile" accept=".csv,.xlsx,.xls"></label>${p.checklist.length?'<button data-a="rematch">Re-match all records</button>':''}</div>
  <h3>Switch project</h3><div class="plist">${db.projects.map(x=>`<button class="${x.id===p.id?'cur':''}" data-a="swp" data-id="${x.id}">${esc(x.name)} <span class="meta">(${x.sites.length} sites)</span></button>`).join('')}</div>
  <h3>Restore a backup</h3><input type="file" id="bkFile" accept=".json">
  <h3>How to speak</h3><ul class="help">
  <li><b>Grey button</b> starts a new site at your position and starts listening. <b>Green</b> = site active, tap to record. <b>Red</b> = recording, tap to stop.</li>
  <li>Start with a keyword: <b>"species</b> red grass next sickle bush and buffalo thorn". "Next" or "and" separates species.</li>
  <li><b>"habitat</b> …" and <b>"note</b> …" take everything after them in that recording.</li>
  <li><b>"site</b> 7" or "site name rocky koppie" as the first words names the site. On a site that already has data it starts a new site.</li>
  <li>Words without a keyword are saved as a note, so nothing is lost.</li></ul>
  <div class="btns"><button class="danger" data-a="delp">Delete this project</button></div>`)}
$('menuBtn').onclick=showMenu;$('typeBtn').onclick=showType;

sheet.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,p=P();
  const s=p.sites.find(x=>x.id===curSite);
  switch(a){
  case'close':closeSheet();break;
  case'delrec':p.records=p.records.filter(r=>r.id!==id);save();render();showSite(curSite);break;
  case'delnote':p.notes=p.notes.filter(n=>n.id!==id);save();showSite(curSite);break;
  case'addsp':{const v=$('addSp').value.trim();if(!v)return;v.split(/\b(?:next|and)\b|,/i).map(x=>x.trim()).filter(Boolean).forEach(n=>p.records.push(applyMatch({id:uid(),siteId:s.id,spoken:cap(n),family:'',scientific:'',common:'',status:'',lat:s.lat,lng:s.lng,acc:s.acc,time:now()})));save();render();showSite(curSite);break}
  case'savesite':s.name=$('sname').value.trim()||s.name;const h=$('hab').value.trim();s.habitat=h?[{text:h,lat:s.lat,lng:s.lng,acc:s.acc,time:(s.habitat[0]||{}).time||now()}]:[];save();render();toast('Saved');showSite(curSite);break;
  case'reopen':if(site())finalise();s.end=null;p.activeSite=s.id;save();render();showSite(curSite);break;
  case'moveSite':Object.assign(s,{lat:fix.lat,lng:fix.lng,acc:fix.acc});save();render();showSite(curSite);break;
  case'delsite':if(!confirm('Delete '+s.name+' and all its records?'))return;p.sites=p.sites.filter(x=>x.id!==s.id);p.records=p.records.filter(r=>r.siteId!==s.id);p.notes=p.notes.filter(n=>n.siteId!==s.id);if(p.activeSite===s.id)p.activeSite=null;save();render();closeSheet();break;
  case'gosite':showSite(id);break;
  case'deltrack':if(!confirm('Delete this track?'))return;p.tracks=p.tracks.filter(t=>t.id!==id);if(p.activeTrack===id)p.activeTrack=null;save();render();closeSheet();break;
  case'typed':{const v=$('typed').value;closeSheet();processText(v,fix);break}
  case'savep':p.name=$('pname').value.trim()||p.name;save();render();toast('Renamed');break;
  case'newp':{if(recording)return;const n=prompt('New project name');if(n===null)return;newProject(n.trim());render();showMenu();break}
  case'swp':if(recording)return;db.active=id;save();render();showMenu();break;
  case'delp':if(!confirm('Delete project "'+p.name+'" permanently? Export first!'))return;db.projects=db.projects.filter(x=>x.id!==p.id);if(!db.projects.length)newProject();else db.active=db.projects[0].id;save();render();closeSheet();break;
  case'rematch':p.records.forEach(applyMatch);save();toast('Re-matched '+p.records.length+' records');break;
  case'xlsx':exportXlsx(false);break;case'share':exportXlsx(true);break;
  case'csv':download(new Blob(['﻿'+toCSV(speciesRows())],{type:'text/csv'}),fname('csv'));break;
  case'kml':download(new Blob([toKML()],{type:'application/vnd.google-earth.kml+xml'}),fname('kml'));break;
  case'geojson':download(new Blob([JSON.stringify(toGeo(),null,1)],{type:'application/geo+json'}),fname('geojson'));break;
  case'backup':download(new Blob([JSON.stringify(p)],{type:'application/json'}),fname('backup.json'));break;
  }});
sheet.addEventListener('focusout',e=>{const c=e.target;if(!c.dataset||!c.dataset.f)return;const r=P().records.find(x=>x.id===c.dataset.id);if(r){r[c.dataset.f]=c.textContent.trim();save()}});
sheet.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id==='clFile')loadChecklist(f);
  if(e.target.id==='bkFile'){f.text().then(t=>{const d=JSON.parse(t);if(!d.sites)throw 0;d.id=uid();d.name=d.name+' (restored)';d.activeSite=null;d.activeTrack=null;db.projects.push(d);db.active=d.id;save();render();showMenu();toast('Backup restored')}).catch(()=>toast('Not a valid backup file'))}});

/* ---------- checklist import ---------- */
function loadChecklist(file){const rd=new FileReader();rd.onload=()=>{try{
  const wb=XLSX.read(rd.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const col=(row,re)=>{const k=Object.keys(row).find(k=>re.test(k.toLowerCase()));return k?String(row[k]).trim():''};
  const list=rows.map(r=>({family:col(r,/famil/),scientific:col(r,/scien|latin|taxon|species/),common:col(r,/common|english|vernac/),status:col(r,/status|nemba|tops|red/)})).filter(c=>c.scientific||c.common);
  if(!list.length)throw 0;const p=P();p.checklist=list;p.records.forEach(applyMatch);save();toast(list.length+' taxa loaded; records re-matched');showMenu()
}catch(e){toast('Could not read checklist – check the column headings')}};rd.readAsArrayBuffer(file)}

/* ---------- exports ---------- */
const fname=ext=>P().name.replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.'+ext;
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const sName=id=>(P().sites.find(s=>s.id===id)||{}).name||'';
function speciesRows(){const p=P();const H=['Site','Latitude','Longitude','Accuracy (m)','Date','Time','Family','Scientific name','Common name','Status','As spoken','Checklist match'];
  return [H,...p.sites.flatMap(s=>p.records.filter(r=>r.siteId===s.id).map(r=>{const d=new Date(r.time);return[s.name,r.lat??s.lat,r.lng??s.lng,r.acc??s.acc,d.toLocaleDateString('en-ZA'),d.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),r.family,r.scientific,r.common,r.status,r.spoken,r.matched?'Yes':'No']}))]}
function siteRows(){const p=P();return[['Site','Latitude','Longitude','Accuracy (m)','Start','End','Habitat description','No. of species','Notes'],...p.sites.map(s=>[s.name,s.lat,s.lng,s.acc,fmtT(s.start),fmtT(s.end),s.habitat.map(h=>h.text).join(' '),p.records.filter(r=>r.siteId===s.id).length,p.notes.filter(n=>n.siteId===s.id).map(n=>n.text).join(' | ')])]}
function matrixRows(){const p=P();const key=r=>r.scientific||r.common||r.spoken;const sp=[...new Map(p.records.map(r=>[key(r).toLowerCase(),r])).values()].sort((a,b)=>(a.family+key(a)).localeCompare(b.family+key(b)));
  return[['Family','Scientific name','Common name','Status',...p.sites.map(s=>s.name)],...sp.map(r=>[r.family,r.scientific,r.common||(r.scientific?'':r.spoken),r.status,...p.sites.map(s=>p.records.some(x=>x.siteId===s.id&&key(x).toLowerCase()===key(r).toLowerCase())?'x':'')])]}
function exportXlsx(share){const p=P();const wb=XLSX.utils.book_new();
  const add=(rows,name)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add(speciesRows(),'Species records');add(siteRows(),'Sites');add(matrixRows(),'Species x site');
  add([['Site','Note','Latitude','Longitude','Time'],...p.notes.map(n=>[sName(n.siteId),n.text,n.lat,n.lng,fmtT(n.time)])],'Notes');
  add([['Track','Start','End','Length (km)','Points'],...p.tracks.map(t=>[t.name,fmtT(t.start),fmtT(t.end),+(trackLen(t)/1000).toFixed(3),t.pts.length])],'Tracks');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(share&&navigator.canShare){const file=new File([blob],fname('xlsx'),{type:blob.type});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:p.name}).catch(()=>{});return}}
  download(blob,fname('xlsx'))}
const toCSV=rows=>rows.map(r=>r.map(v=>{v=v??'';v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
function toKML(){const p=P();const x=s=>esc(s);
  const pm=p.sites.filter(s=>s.lat!=null).map(s=>{const recs=p.records.filter(r=>r.siteId===s.id);
    const d=`<b>Habitat:</b> ${x(s.habitat.map(h=>h.text).join(' '))}<br><b>Species:</b><br>${recs.map(r=>x((r.scientific||'')+' '+(r.common||(r.scientific?'':r.spoken))+(r.status?' ['+r.status+']':''))).join('<br>')}`;
    return`<Placemark><name>${x(s.name)}</name><description><![CDATA[${d}]]></description><Point><coordinates>${s.lng},${s.lat},0</coordinates></Point></Placemark>`}).join('');
  const tr=p.tracks.filter(t=>t.pts.length>1).map(t=>`<Placemark><name>${x(t.name)}</name><Style><LineStyle><color>ff007aff</color><width>4</width></LineStyle></Style><LineString><coordinates>${t.pts.map(q=>q[1]+','+q[0]+',0').join(' ')}</coordinates></LineString></Placemark>`).join('');
  return`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(p.name)}</name>${pm}${tr}</Document></kml>`}
function toGeo(){const p=P();return{type:'FeatureCollection',features:[
  ...p.sites.filter(s=>s.lat!=null).map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[s.lng,s.lat]},properties:{kind:'site',site:s.name,accuracy_m:s.acc,start:s.start,end:s.end,habitat:s.habitat.map(h=>h.text).join(' '),species:p.records.filter(r=>r.siteId===s.id).map(r=>r.scientific||r.common||r.spoken).join('; ')}})),
  ...p.records.filter(r=>r.lat!=null).map(r=>({type:'Feature',geometry:{type:'Point',coordinates:[r.lng,r.lat]},properties:{kind:'species',site:sName(r.siteId),family:r.family,scientific:r.scientific,common:r.common,status:r.status,spoken:r.spoken,time:r.time}})),
  ...p.tracks.filter(t=>t.pts.length>1).map(t=>({type:'Feature',geometry:{type:'LineString',coordinates:t.pts.map(q=>[q[1],q[0]])},properties:{kind:'track',name:t.name,start:t.start,end:t.end,length_km:+(trackLen(t)/1000).toFixed(3)}}))]}}

render();if(site()||track())wake();
}
</script>
